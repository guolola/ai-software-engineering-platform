# Nginx site template for the UML platform production deployment.
# Replace server_name with your domain or public IP before enabling it.
server {
    listen 80;
    server_name _;

    root /www/wwwroot/uml-platform/current/apps/web/dist;
    index index.html;
    error_page 404 /404.html;

    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Marketing routes are prerendered so crawlers receive content and canonical metadata without JavaScript.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~ ^/(features|workflow|cases|pricing)/?$ {
        return 404;
    }

    # Authenticated and utility routes keep the SPA shell but must never enter a search index.
    location ~ ^/(login|register|verify-email|forgot-password|reset-password|workspace|exam|tutorial|invitations/accept|billing/alipay/return|account|account/security|settings/models|account/billing)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html /index.html =404;
    }

    location ~ ^/projects(?:/.*)?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html /index.html =404;
    }

    location = /app.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /indexnow-key.txt {
        alias /www/wwwroot/uml-platform/shared/seo/indexnow-key.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        root /www/wwwroot/uml-platform/shared/web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
